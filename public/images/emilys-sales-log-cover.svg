<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Inter, sans-serif">
  <defs>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#1d1d1d"/>
    </pattern>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,1 L9,5 L0,9" fill="none" stroke="#5a5a5a" stroke-width="1.5"/>
    </marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,1 L9,5 L0,9" fill="none" stroke="#e8b84a" stroke-width="1.5"/>
    </marker>
    <style>
      .node{fill:#141414;stroke:#2e2e2e;stroke-width:1.5}
      .ic{fill:none;stroke:#e9e9e9;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
      .icA{fill:none;stroke:#e8b84a;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
      .lbl{fill:#d6d6d6;font-size:17px;font-weight:500;text-anchor:middle}
      .sub{fill:#6f6f6f;font-size:13.5px;text-anchor:middle}
      .ln{stroke:#5a5a5a;stroke-width:1.6;fill:none}
      .lnA{stroke:#e8b84a;stroke-width:1.6;fill:none;stroke-dasharray:5 5}
      .phase{fill:#7c7c7c;font-size:14px;font-weight:600;letter-spacing:2.5px}
    </style>
  </defs>

  <rect width="1600" height="900" fill="#0a0a0a"/>
  <rect width="1600" height="900" fill="url(#dots)"/>

  <!-- header -->
  <text x="80" y="110" fill="#f2f2f2" font-size="44" font-weight="600" letter-spacing="-0.5">Emily's Sales Log Automation</text>
  <text x="80" y="150" fill="#7c7c7c" font-size="19">Handwritten sales logs → vendor billing  ·  n8n · Claude · Google Workspace</text>

  <text x="1520" y="104" fill="#f2f2f2" font-size="44" font-weight="600" text-anchor="end" letter-spacing="-0.5">6 hrs <tspan fill="#5a5a5a">→</tspan> <tspan fill="#e8b84a">5–10 min</tspan></text>
  <text x="1520" y="140" fill="#7c7c7c" font-size="17" text-anchor="end">monthly invoicing, 30+ sheets</text>

  <!-- PHASE 1 -->
  <text x="80" y="270" class="phase">PHASE 1 · EXTRACT &amp; COMPILE</text>
  <line x1="80" y1="285" x2="1520" y2="285" stroke="#1f1f1f"/>

  <!-- connectors phase 1: node centers at x = 140 + i*220, y=380 ; node 120x120 -->
  <g class="ln">
    <path d="M200,380 H302" marker-end="url(#arr)"/>
    <path d="M420,380 H522" marker-end="url(#arr)"/>
    <path d="M640,380 H742" marker-end="url(#arr)"/>
    <path d="M860,380 H962" marker-end="url(#arr)"/>
    <path d="M1080,380 H1182" marker-end="url(#arr)"/>
    <path d="M1300,380 H1402" marker-end="url(#arr)"/>
  </g>

  <!-- 1 schedule -->
  <rect class="node" x="80" y="320" width="120" height="120" rx="22"/>
  <g class="ic"><circle cx="140" cy="380" r="22"/><path d="M140,366 V380 L150,388"/></g>
  <text class="lbl" x="140" y="476">Schedule</text><text class="sub" x="140" y="497">1st of month</text>

  <!-- 2 gmail -->
  <rect class="node" x="300" y="320" width="120" height="120" rx="22"/>
  <g class="ic"><rect x="336" y="364" width="48" height="34" rx="4"/><path d="M337,366 L360,384 L383,366"/></g>
  <text class="lbl" x="360" y="476">Gmail</text><text class="sub" x="360" y="497">pull log photos</text>

  <!-- 3 drive -->
  <rect class="node" x="520" y="320" width="120" height="120" rx="22"/>
  <g class="ic"><path d="M554,370 V398 H606 V374 H580 L574,366 H558 Q554,366 554,370 Z"/></g>
  <text class="lbl" x="580" y="476">Drive</text><text class="sub" x="580" y="497">monthly folder</text>

  <!-- 4 claude vision -->
  <rect class="node" x="740" y="320" width="120" height="120" rx="22" stroke="#4a4a4a"/>
  <g class="ic"><path d="M772,380 Q800,354 828,380 Q800,406 772,380 Z"/><circle cx="800" cy="380" r="7"/></g>
  <text class="lbl" x="800" y="476">Claude Vision</text><text class="sub" x="800" y="497">extract sales</text>

  <!-- 5 usable? -->
  <rect class="node" x="960" y="320" width="120" height="120" rx="22"/>
  <g class="ic"><path d="M1020,356 L1044,380 L1020,404 L996,380 Z"/><path d="M1013,381 L1018,386 L1028,375"/></g>
  <text class="lbl" x="1020" y="476">Usable photo?</text><text class="sub" x="1020" y="497">quality gate</text>

  <!-- 6 rows & checks -->
  <rect class="node" x="1180" y="320" width="120" height="120" rx="22"/>
  <g class="ic"><path d="M1222,362 L1210,380 L1222,398"/><path d="M1258,362 L1270,380 L1258,398"/><path d="M1246,360 L1234,400"/></g>
  <text class="lbl" x="1240" y="476">Rows &amp; checks</text><text class="sub" x="1240" y="497">parse + validate</text>

  <!-- 7 sheet -->
  <rect class="node" x="1400" y="320" width="120" height="120" rx="22"/>
  <g class="ic"><rect x="1434" y="356" width="52" height="48" rx="4"/><path d="M1434,372 H1486 M1434,388 H1486 M1452,356 V404"/></g>
  <rect x="1453.5" y="373.5" width="31" height="13" fill="#e8b84a" opacity="0.55"/>
  <text class="lbl" x="1460" y="476">Google Sheet</text><text class="sub" x="1460" y="497">by day · by vendor</text>

  <!-- PHASE 2 -->
  <text x="166" y="620" class="phase">PHASE 2 · REVIEW &amp; BILL</text>
  <line x1="166" y1="635" x2="1520" y2="635" stroke="#1f1f1f"/>

  <!-- handoff curve from sheet down to phase 2 start -->
  <path class="lnA" d="M1460,515 V560 Q1460,575 1445,575 H155 Q140,575 140,590 V662" marker-end="url(#arrA)"/>

  <!-- phase 2 nodes centers x=140, 500, 860, 1220?  use spacing 360 -->
  <g class="ln">
    <path d="M200,730 H542" marker-end="url(#arr)"/>
    <path d="M660,730 H1002" marker-end="url(#arr)"/>
    <path d="M1120,730 H1402" marker-end="url(#arr)"/>
  </g>

  <!-- flagged -->
  <rect class="node" x="80" y="670" width="120" height="120" rx="22" stroke="#5a4a22"/>
  <g class="icA"><path d="M126,756 V706"/><path d="M126,708 H160 L152,720 L160,732 H126"/></g>
  <text class="lbl" x="140" y="826">Flagged entries</text><text class="sub" x="140" y="847">unclear handwriting</text>

  <!-- emily corrects -->
  <rect class="node" x="540" y="670" width="120" height="120" rx="22"/>
  <g class="ic"><path d="M582,752 L586,738 L616,708 L628,720 L598,750 Z"/><path d="M610,714 L622,726"/></g>
  <text class="lbl" x="600" y="826">Owner review</text><text class="sub" x="600" y="847">human in the loop</text>

  <!-- sent back -->
  <rect class="node" x="1000" y="670" width="120" height="120" rx="22"/>
  <g class="ic"><path d="M1084,742 Q1084,712 1054,712 H1036"/><path d="M1046,700 L1034,712 L1046,724"/></g>
  <text class="lbl" x="1060" y="826">Back to n8n</text><text class="sub" x="1060" y="847">corrected sheet</text>

  <!-- vendor billing -->
  <rect class="node" x="1400" y="670" width="120" height="120" rx="22" stroke="#4a4a4a"/>
  <g class="ic"><path d="M1440,704 H1480 V756 L1472,750 L1464,756 L1456,750 L1448,756 L1440,750 Z"/><path d="M1450,720 H1470 M1450,732 H1466"/></g>
  <text class="lbl" x="1460" y="826">Vendor billing</text><text class="sub" x="1460" y="847">per-vendor invoices</text>
</svg>
